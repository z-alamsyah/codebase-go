version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/z-alamsyah/codebase-go/gen/proto
plugins:
  # Plugins run through `go tool`, so their versions are pinned in go.mod.
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/proto
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen/proto
    opt: paths=source_relative
