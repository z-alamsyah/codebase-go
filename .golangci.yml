version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # constructors and handlers are self-explanatory
    sloglint:
      attr-only: true # slog.String("k", v) instead of loose "k", v pairs
  exclusions:
    generated: lax
    paths:
      - gen
      - mocks
    rules:
      - path: _test\.go
        linters: [gosec, unparam, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/z-alamsyah/codebase-go
