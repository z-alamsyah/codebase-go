syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

// UserService is the gRPC transport for the user use cases.
// It calls the same business logic as the REST endpoints.
service UserService {
  // GetUser returns one user by id.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // CreateUser registers a new user and publishes the user.created event.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  string password = 4;
}

message CreateUserResponse {
  User user = 1;
}
